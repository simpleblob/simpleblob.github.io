[site]
title = "SIMPLEBLOB"
tagline = "My Notebook — kept since 2013"
description = "A personal notebook used as an extension of memory: book summaries, machine-learning reading lists and working notes."
author = "simpleblob"
# Written obfuscated on purpose (see the contact page)
email = "siimmmpleebblloobb at gmail dot com."

[paths]
# Relative to myblog/
posts_source = "posts"
templates = "templates"
# Site root that receives index.html, archive.html, contact.html and posts/
output = ".."

[build]
# Reuse Pandoc output for unchanged posts (cached in myblog/.pandoc_cache/)
incremental = true

[post]
required_fields = ["title", "created", "published"]
words_per_minute = 230

# The card catalogue: one drawer per topic, in display order.
# A post joins a drawer with `topic: <slug>` in its frontmatter;
# `unlisted: true` builds the page but keeps it out of every list.
[[topics]]
slug = "bk"
code = "BK·01"
name = "Books & Ideas"
blurb = "Book and talk summaries."
see_also = []

[[topics]]
slug = "mm"
code = "MM·02"
name = "Machines & Math"
blurb = ""
see_also = []

