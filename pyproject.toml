[project]
name = "simpleblob-sitegen"
version = "0.2.0"
description = "Static site generator for personal blog"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pytest>=7.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
